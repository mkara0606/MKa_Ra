<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポータブルダンシング</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#14062b;--ink:#f6efff;--pink:#ff3d8b;--cyan:#3de0ff;--gold:#ffd23d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{position:relative}
canvas{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(20,6,43,.82);padding:24px}
#ov[hidden]{display:none}
h1{margin:0;font-size:clamp(34px,9vw,68px);font-weight:400;line-height:1.05;color:var(--ink);text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--cyan)}
p{margin:0;max-width:34em;line-height:1.7;font-size:15px;font-family:'Hiragino Sans','Yu Gothic',sans-serif;font-weight:600}
button{font:inherit;font-size:22px;padding:14px 40px;border:0;border-radius:6px;background:var(--gold);color:#2a0a4a;cursor:pointer;box-shadow:0 6px 0 #b88f00}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #b88f00}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.rank{font-size:96px;line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button.s{font-size:15px;padding:9px 16px;background:var(--cyan);box-shadow:0 4px 0 #1d8aa3}
.jk{width:min(40vw,220px);aspect-ratio:1;object-fit:cover;border-radius:8px;box-shadow:6px 6px 0 var(--pink)}
#ed{position:absolute;top:0;right:0;bottom:0;width:270px;overflow:auto;background:rgba(20,6,43,.95);padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;font:600 13px 'Hiragino Sans','Yu Gothic',sans-serif;border-left:2px solid var(--pink);touch-action:pan-y}
#ed[hidden]{display:none}
#ed label{display:flex;flex-direction:column;gap:3px;flex:1}
#ed input,#ed select{font:inherit;padding:6px;border-radius:4px;border:1px solid #5a3a9a;background:#241048;color:var(--ink);width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.r2{display:flex;gap:8px}.r2 button{flex:1;padding:9px 4px}
.sl{display:flex;gap:18px;width:min(980px,100%);height:min(82vh,620px);text-align:left;align-items:stretch}
.list{flex:1.1;min-width:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;padding:4px}
.card{display:grid;grid-template-columns:56px 1fr;column-gap:12px;align-items:center;text-align:left;font-size:16px;padding:8px 12px;background:#241048;color:var(--ink);box-shadow:none;border:2px solid #5a3a9a;border-radius:8px}
.card img,.card i{grid-row:1/3;width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--pink)}
.card span{font:600 12px 'Hiragino Sans','Yu Gothic',sans-serif;opacity:.8}
.card.on{border-color:var(--gold);background:#3a1a70}
.det{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;overflow-y:auto;overflow-x:hidden;min-width:0;overscroll-behavior:contain}
.det label{display:flex;flex-direction:column;gap:4px;width:100%;font:600 13px 'Hiragino Sans','Yu Gothic',sans-serif}
.det input[type=range]{width:100%}
.list,.det{touch-action:pan-y}
#ov{overflow:hidden}
.det .jk{width:auto;height:min(26vh,200px);flex:none}
.ph{aspect-ratio:1;background:#241048;border-radius:8px;box-shadow:6px 6px 0 var(--pink)}
.det h1{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn{min-height:1.7em}
#ov.ttl{background:radial-gradient(ellipse at 50% 28%,#2a0d5c 0%,#0b0418 72%);overflow:hidden;gap:0}
#ov.ttl::before{content:'';position:absolute;left:-50%;right:-50%;bottom:-8%;height:58%;background:linear-gradient(rgba(61,224,255,.4) 1px,transparent 1px) 0 0/100% 48px,linear-gradient(90deg,rgba(61,224,255,.4) 1px,transparent 1px) 0 0/64px 100%;transform:perspective(380px) rotateX(62deg);transform-origin:50% 100%;animation:gr 2s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 65%);mask-image:linear-gradient(transparent,#000 65%)}
@keyframes gr{to{background-position:0 48px,0 0}}
#ov.ttl>*{position:relative;z-index:1}
.lg{font:700 clamp(28px,6.4vw,68px)/1.15 'Syncopate','Dela Gothic One',sans-serif;letter-spacing:.3em;margin-left:.3em;color:#f6efff;text-shadow:0 0 28px rgba(61,224,255,.5)}
.lg small{display:block;font:600 clamp(11px,1.5vw,14px)/1 'Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:.7em;margin:22px 0 0 .7em;color:#3de0ff}
.mm{margin-top:56px;display:flex;flex-direction:column;width:min(300px,80vw)}
.mb{background:none;box-shadow:none;border:0;border-bottom:1px solid rgba(246,239,255,.25);border-radius:0;color:#f6efff;font:700 15px 'Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:.25em;padding:15px 6px;text-align:left;transition:.2s}
.mb span{float:right;font:400 11px 'Syncopate',sans-serif;letter-spacing:.3em;opacity:.55}
.mb:hover,.mb:focus-visible{color:#3de0ff;border-color:#3de0ff;padding-left:18px;outline:none;text-shadow:0 0 12px rgba(61,224,255,.6)}
.mb:active{transform:none;box-shadow:none}
#ov.res{background:#14062b;animation:fi .8s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.jr{display:grid;grid-template-columns:90px 1fr 56px;gap:8px;align-items:center;width:min(460px,100%);font:700 15px 'Hiragino Sans','Yu Gothic',sans-serif;text-align:left}
.jr i{display:block;height:12px;border-radius:6px}.jr b{text-align:right}
.det select{font:inherit;padding:6px;background:#241048;color:var(--ink);border:1px solid #5a3a9a;border-radius:4px}
#ck{position:absolute;top:8px;right:8px;width:300px;background:rgba(20,6,43,.92);padding:10px;border-radius:8px;display:flex;flex-direction:column;gap:6px;font:600 12px 'Hiragino Sans','Yu Gothic',sans-serif;border:2px solid var(--pink)}
#ck[hidden]{display:none}
#ck label{display:flex;flex-direction:column;gap:2px}
#pv{display:block;width:auto;max-width:100%;max-height:34vh;margin:0 auto;border-radius:6px;background:#000}
@media(max-width:640px){.sl{flex-direction:column}.list{max-height:30vh;flex:none}}
#ed p{font-size:12px;opacity:.8;max-width:none}
#msg{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f6efff;color:#2a0a4a;padding:8px 16px;border-radius:6px;font:700 14px 'Hiragino Sans','Yu Gothic',sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}

/* ===== v2: editor & select screen ===== */
.sq{padding:0 28px 12px}
.sq input{width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;background:none;border:0;border-bottom:1px solid rgba(246,239,255,.25);border-radius:0;color:var(--ink);font:600 13px 'Hiragino Sans','Yu Gothic',sans-serif;padding:9px 2px;outline:none;user-select:text;-webkit-user-select:text}
.sq input:focus{border-bottom-color:var(--cyan)}
.sq input::placeholder{color:rgba(246,239,255,.35)}
.nm{opacity:.5;padding:18px 14px;font-size:13px}
#ed{width:296px;background:rgba(10,4,24,.96);padding:0;gap:0;border-left:1px solid rgba(61,224,255,.35);font:600 12px 'Hiragino Sans','Yu Gothic',sans-serif;color:var(--ink);overflow:hidden;touch-action:auto}
#ed button{background:none;box-shadow:none;border:0;border-radius:0;color:var(--ink);font:600 12px 'Hiragino Sans','Yu Gothic',sans-serif;padding:8px 6px;cursor:pointer;transition:.15s}
#ed button:active{transform:none;box-shadow:none}
#ed .eh{padding:16px 16px 10px;display:flex;flex-direction:column;gap:6px}
#ed .eh b{font:700 13px 'Syncopate',sans-serif;letter-spacing:.4em;color:var(--cyan)}
#e_info{font-size:11px;opacity:.6;line-height:1.5}
.etabs{display:flex;border-bottom:1px solid rgba(246,239,255,.12);padding:0 8px}
#ed .etabs button{flex:1;padding:11px 0;opacity:.5;border-bottom:2px solid transparent}
#ed .etabs button.on{opacity:1;color:var(--cyan);border-bottom-color:var(--cyan)}
.pane{display:none;padding:14px 16px;overflow-y:auto;flex:1;flex-direction:column;gap:10px;min-height:0}
.pane.on{display:flex}
.lab{font:700 10px 'Syncopate','Hiragino Sans',sans-serif;letter-spacing:.25em;opacity:.45;margin-top:4px}
.seg{display:flex;border:1px solid rgba(246,239,255,.2);border-radius:6px;overflow:hidden}
#ed .seg button{flex:1;padding:9px 2px;border-right:1px solid rgba(246,239,255,.12)}
#ed .seg button:last-child{border-right:0}
#ed .seg button.on{background:rgba(61,224,255,.18);color:var(--cyan)}
#ed .bt{border:1px solid rgba(246,239,255,.22);border-radius:6px;padding:8px 4px;flex:1}
#ed .bt:hover{border-color:var(--cyan);color:var(--cyan)}
#ed label{display:flex;flex-direction:column;gap:5px;flex:1;font-size:11px;opacity:.9}
#ed input,#ed select{background:rgba(246,239,255,.06);border:1px solid rgba(246,239,255,.18);border-radius:6px;padding:7px 8px;color:var(--ink);font:inherit}
#ed p{font-size:11px;opacity:.5;line-height:1.7}
.efoot{padding:12px 16px 16px;border-top:1px solid rgba(246,239,255,.12);display:flex;flex-direction:column;gap:8px}
#ed .pri{background:linear-gradient(90deg,#3de0ff,#7b5cff);color:#0b0418;font-weight:700;border-radius:6px;padding:12px;letter-spacing:.08em;font-size:13px}
#ov.sel{background:radial-gradient(ellipse at 70% 15%,#26104f 0%,#0b0418 70%);padding:0;gap:0;align-items:stretch;justify-content:stretch;text-align:left}
.sx{display:flex;width:100%;height:100%}
.sl2{width:min(42%,420px);display:flex;flex-direction:column;border-right:1px solid rgba(246,239,255,.1);min-width:0}
.sh{padding:30px 28px 14px;display:flex;align-items:baseline;gap:14px}
.sh b{font:700 15px 'Syncopate',sans-serif;letter-spacing:.4em;color:var(--cyan)}
.sh span{font:600 12px 'Hiragino Sans','Yu Gothic',sans-serif;opacity:.5;letter-spacing:.2em}
.list2{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 24px;display:flex;flex-direction:column;gap:2px;touch-action:pan-y;overscroll-behavior:contain}
.sc{display:grid;grid-template-columns:48px 1fr;column-gap:14px;align-items:center;text-align:left;background:none;box-shadow:none;border:0;border-left:3px solid transparent;border-radius:0;padding:10px 12px;color:var(--ink);font:700 15px 'Hiragino Sans','Yu Gothic',sans-serif;transition:.15s}
.sc:active{transform:none;box-shadow:none}
.sc img,.sc i{grid-row:1/3;width:48px;height:48px;object-fit:cover;border-radius:4px;background:linear-gradient(135deg,#3de0ff,#7b5cff)}
.sc span{font:500 11px 'Hiragino Sans','Yu Gothic',sans-serif;opacity:.55}
.sc:hover{background:rgba(246,239,255,.05)}
.sc.on{border-left-color:var(--cyan);background:linear-gradient(90deg,rgba(61,224,255,.14),transparent)}
.dt{flex:1;min-width:0;display:flex;flex-direction:column;gap:24px;padding:42px 46px;overflow-y:auto;touch-action:pan-y}
.hero{display:flex;gap:26px;align-items:flex-end}
.hero img,.ph2{width:min(24vw,220px);aspect-ratio:1;object-fit:cover;border-radius:6px;box-shadow:0 0 44px rgba(61,224,255,.2);background:linear-gradient(135deg,#3de0ff,#7b5cff);flex:none}
.meta{min-width:0}
.meta h2{margin:0;font:700 clamp(22px,3.4vw,38px)/1.2 'Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:.04em;overflow-wrap:anywhere}
.meta p{opacity:.6;margin:6px 0 14px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips em{font:600 11px 'Syncopate','Hiragino Sans',sans-serif;font-style:normal;letter-spacing:.15em;border:1px solid rgba(246,239,255,.25);border-radius:20px;padding:5px 12px}
.chips em.ok{color:var(--cyan);border-color:rgba(61,224,255,.5)}
.chips em.warn{color:#ff9ad0;border-color:#ff9ad0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px;max-width:560px}
.opts label{display:grid;grid-template-columns:1fr auto;gap:8px 10px;font:600 11px 'Syncopate','Hiragino Sans',sans-serif;letter-spacing:.2em;align-items:center}
.opts label b{font:700 13px 'Hiragino Sans',sans-serif;letter-spacing:0;color:var(--cyan)}
.opts input[type=range]{grid-column:1/3;width:100%;accent-color:#3de0ff}
.opts select{grid-column:1/3;background:rgba(246,239,255,.06);border:1px solid rgba(246,239,255,.2);border-radius:6px;padding:9px 10px;color:var(--ink);font:600 13px 'Hiragino Sans','Yu Gothic',sans-serif}
.go{align-self:flex-start;background:linear-gradient(90deg,#3de0ff,#7b5cff);color:#0b0418;box-shadow:0 0 30px rgba(61,224,255,.35);border-radius:3px;font:700 18px 'Syncopate','Hiragino Sans',sans-serif;letter-spacing:.4em;padding:16px 56px}
.go:active{transform:none;box-shadow:0 0 14px rgba(61,224,255,.5)}
.links{display:flex;flex-wrap:wrap;gap:6px 20px}
.links button{background:none;box-shadow:none;color:var(--ink);opacity:.6;font:600 12px 'Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:.1em;padding:6px 0;border-radius:0;border-bottom:1px solid transparent}
.links button:hover{opacity:1;color:var(--cyan);border-bottom-color:var(--cyan)}
.links button:active{transform:none;box-shadow:none}
@media(max-width:720px){.sx{flex-direction:column}.sl2{width:100%;max-height:34%;border-right:0;border-bottom:1px solid rgba(246,239,255,.1)}.dt{padding:20px;gap:16px}.hero img,.ph2{width:96px}.opts{grid-template-columns:1fr}.opts label[style]{grid-column:1}}
#sm{position:absolute;inset:0;background:rgba(5,2,14,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:5}
.card2{width:min(440px,92vw);max-height:90%;overflow-y:auto;background:#120a2a;border:1px solid rgba(61,224,255,.35);border-radius:10px;padding:26px 28px;display:flex;flex-direction:column;gap:20px;box-shadow:0 0 60px rgba(61,224,255,.15);text-align:left}
.card2 h3{margin:0;font:700 14px 'Syncopate',sans-serif;letter-spacing:.4em;color:var(--cyan)}
.sr{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;font:600 13px 'Hiragino Sans','Yu Gothic',sans-serif}
.sr b{color:var(--cyan);font-weight:700}
.sr input[type=range]{grid-column:1/3;width:100%;accent-color:#3de0ff}
.seg2{display:flex;border:1px solid rgba(246,239,255,.25);border-radius:6px;overflow:hidden}
.seg2 button{background:none;box-shadow:none;border:0;border-radius:0;color:var(--ink);font:700 12px 'Syncopate',sans-serif;letter-spacing:.15em;padding:8px 18px;opacity:.5}
.seg2 button.on{background:rgba(61,224,255,.2);color:var(--cyan);opacity:1}
.seg2 button:active,.go2:active{transform:none;box-shadow:none}
.go2{align-self:flex-end;background:none;box-shadow:none;border:1px solid rgba(246,239,255,.3);border-radius:20px;color:var(--ink);font:600 13px 'Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:.2em;padding:8px 28px}
.go2:hover{border-color:var(--cyan);color:var(--cyan)}
.gear{margin-left:auto;background:none;box-shadow:none;border:1px solid rgba(246,239,255,.3);border-radius:20px;color:var(--ink);font:600 10px 'Syncopate',sans-serif;letter-spacing:.2em;padding:7px 14px}
.gear:hover{border-color:var(--cyan);color:var(--cyan)}
.gear:active{transform:none;box-shadow:none}

/* ===== v3: mobile / collapsible panels ===== */
.ehr{display:flex;align-items:center;gap:8px}
.ehr .bt{margin-left:auto;flex:none;padding:6px 12px}
#ed .etb{display:none}
#ed.col{top:auto;left:0;right:0;bottom:0;width:auto;height:auto;border-left:0;border-top:1px solid rgba(61,224,255,.35);padding-bottom:env(safe-area-inset-bottom,0px)}
#ed.col>.eh,#ed.col>.etabs,#ed.col>.pane,#ed.col>.efoot{display:none}
#ed.col .etb{display:flex;gap:8px;align-items:center;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.etb .seg{flex:none}
#ed .etb .seg button{padding:9px 11px;font-size:12px;flex:none}
#ed .etb .bt{flex:none;padding:9px 12px}
#ed .etb .pri{flex:none;padding:9px 16px;font-size:12px}
#t_info{font-size:11px;color:#ff9ad0;flex:none}
@media(max-width:720px){#ed{width:min(296px,86vw)}}
.ckh{display:flex;align-items:center;gap:8px}
.ckh b{font:700 12px 'Syncopate',sans-serif;letter-spacing:.3em;color:var(--cyan)}
.ckh span{font-size:11px;color:#ffd23d;margin-right:auto}
.ckh button{background:none;box-shadow:none;border:1px solid rgba(246,239,255,.3);border-radius:14px;color:var(--ink);font:600 11px 'Hiragino Sans','Yu Gothic',sans-serif;padding:5px 11px}
.ckh button:active{transform:none;box-shadow:none}
#ck{max-height:calc(100% - 16px);overflow-y:auto}
#ck.col{width:auto}
#ck.col #ckb{display:none}
@media(max-width:720px){#ck{width:min(300px,calc(100vw - 16px))}#ck.col{width:auto}}
#am{position:absolute;inset:0;background:rgba(5,2,14,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:7}
#am[hidden]{display:none}
#am_n{font:700 56px 'Syncopate',sans-serif;color:#3de0ff;text-align:center}
#am_n:empty{display:none}
#am .r2{justify-content:flex-end}
#pb{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:4;background:rgba(20,6,43,.55);box-shadow:none;border:1px solid rgba(246,239,255,.3);border-radius:16px;color:var(--ink);font:600 11px 'Syncopate',sans-serif;letter-spacing:.2em;padding:8px 14px}
#pb[hidden]{display:none}
#pb:active{transform:none;box-shadow:none}
#pm{position:absolute;inset:0;background:rgba(5,2,14,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:8}
#pm[hidden]{display:none}
#pm .card2{width:min(340px,88vw);align-items:stretch}
#pm_n{font:700 64px 'Syncopate',sans-serif;color:#3de0ff;text-align:center}
#pm_n:empty{display:none}
.pmb{display:flex;flex-direction:column;gap:12px}
.pmb[hidden]{display:none}
.pmb .go2{align-self:stretch;text-align:center;padding:13px}
#ov.intro{background:radial-gradient(ellipse at 50% 40%,#26104f 0%,#0b0418 70%);animation:fi .5s ease;cursor:pointer}
.jv{display:flex;flex-direction:column;align-items:center;gap:14px;animation:zin 2.8s ease-out both}
.jv img,.ph3{width:min(56vw,50vh,360px);aspect-ratio:1;object-fit:cover;border-radius:8px;box-shadow:0 0 70px rgba(61,224,255,.35)}
.ph3{background:linear-gradient(135deg,#3de0ff,#7b5cff)}
.jv h2{margin:6px 0 0;font:700 clamp(20px,4vw,34px)/1.2 'Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:.05em;overflow-wrap:anywhere}
.jv p{margin:0;opacity:.6}
.jbar{width:min(260px,60vw);height:2px;background:rgba(246,239,255,.15);overflow:hidden;margin-top:10px}
.jbar i{display:block;height:100%;background:#3de0ff;animation:jb 2.8s linear both}
@keyframes zin{from{transform:scale(.94);opacity:0}15%{opacity:1}to{transform:scale(1)}}
@keyframes jb{from{width:0}to{width:100%}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="ov"></div>
<div id="ed" hidden>
<div class="eh"><div class="ehr"><b>EDITOR</b><button class="bt" id="e_col">しまう</button></div><span id="e_info"></span></div>
<div class="etabs"><button data-tab="a" class="on">編集</button><button data-tab="b">曲情報</button><button data-tab="c">ファイル</button></div>
<div class="pane on" data-pane="a">
<div class="lab">モード</div>
<div class="seg" id="e_mode"><button data-m="put" class="on">配置</button><button data-m="sel">選択</button><button data-m="del">削除</button></div>
<div class="lab">ノーツ</div>
<div class="seg" id="e_kseg"><button data-k="t" class="on">タップ</button><button data-k="l">ロング</button><button data-k="j">ジャンプ</button><button data-k="d">ダウン</button></div>
<div class="r2"><label>手（Ctrl押下=R）<button class="bt" id="e_hb">L</button></label><label>幅（床の1/N）<select id="e_w"><option value="1">1</option><option value="2">2</option><option value="4" selected>4</option><option value="6">6</option><option value="8">8</option><option value="12">12</option><option value="16">16</option><option value="24">24</option><option value="32">32</option></select></label></div>

<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');
const HIT_R=.13;const hue=x=>`hsl(${340-x*290},100%,62%)`;
let APP=1.4,LEAD=2,BEAT=60/128,OFF=0,END=0,mode='game',testing=false,song,songs=[],sel=0,LOOPT=0,TOT=1,paused=false,chk=[];
let W,H,dpr,ctx,out,outM,outS,NB,t0=0,notes=[],st={},flash=[],jt='',jtc='#fff',jtt=-9,running=false;

function rs(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);rs();

function chart(){
  let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  const n=[];let prev=.5;
  const far=p=>{let x;do{x=.08+r()*.84}while(Math.abs(x-p)<.2);return x};
  for(let i=16;i<240;i++){
    const t=i*BEAT/2,even=i%2===0,hot=i>=96&&i<192;
    if(i%16===14&&i>=64){const a=far(prev),b=far(a);n.push({t,x:a},{t,x:b});prev=b;continue}
    if(r()<(even?(hot?.95:.8):(hot?.55:.25))){
      const x=r()<.5?Math.min(.92,Math.max(.08,prev+(r()-.5)*.5)):far(prev);
      prev=x;n.push({t,x});
    }
  }
  return n.map(x=>({...x,done:false}));
}

function osc(type,f,a,d,v,f2,se){
  const o=ctx.createOscillator(),gn=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,a);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,a+d);
  gn.gain.setValueAtTime(v,a);gn.gain.exponentialRampToValueAtTime(.001,a+d);
  o.connect(gn).connect(se?outS:outM);o.start(a);o.stop(a+d+.02);
}
function noise(a,d,v,hz,type){
  const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),gn=ctx.createGain();
  s.buffer=NB;f.type=type;f.frequency.value=hz;
  gn.gain.setValueAtTime(v,a);gn.gain.exponentialRampToValueAtTime(.001,a+d);
  s.connect(f).connect(gn).connect(outM);s.start(a);s.stop(a+d);
}
function music(){
  const root=[110,87.31,130.81,98],arp=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]];
  for(let b=0;b<128;b++){
    const a=t0+b*BEAT,bar=Math.floor(b/4)%4;
    osc('sine',150,a,.22,.9,40);
    if(b>=8&&b%4%2===1)noise(a,.15,.3,1800,'bandpass');
    noise(a+BEAT/2,.05,.1,7000,'highpass');
    if(b>=4)osc('triangle',root[bar]/2,a,BEAT*.9,.4);
    if(b>=8&&b<120)for(let h=0;h<2;h++){const j=b*2+h;osc('square',arp[bar][[0,1,2,1][j%4]]*(h?2:1),a+h*BEAT/2,BEAT*.4,.045)}
  }
}

function start(){
  if(!ctx)ctx=new AudioContext();
  ctx.resume();
  NB=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);
  const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  if(out)out.disconnect();mkOut();
  BEAT=60/song.bpm;const U=song.uoff/1000;OFF=(song.builtin?0:song.offset)+U;APP=1.4/Opt.spd;LEAD=Math.max(2,APP+.3);
  notes=song.builtin?chart().map(n=>({...n,t:n.t+U,k:'t'})):song.notes.map(n=>({t:OFF+n.b*BEAT,x:n.x,k:n.k||'t',h:n.h,w:n.w,wd:n.wd,pts:n.k==='l'?[[OFF+n.b*BEAT,n.x],...lp(n).map(q=>[OFF+(n.b+q.d)*BEAT,q.x])]:null,e:n.k==='l'?OFF+(n.b+ltail(n).d)*BEAT:0,done:false,held:null}));
  END=Math.max(...notes.map(n=>n.e||n.t));TOT=notes.length+notes.filter(n=>n.k==='l').length||1;
  if(!notes.length){toast('ノーツがありません');return menu()}
  st={P:0,Gr:0,Go:0,M:0,score:0,combo:0,max:0,auto:Opt.auto&&!song.check};
  t0=ctx.currentTime+LEAD;
  if(song.buf){const s=ctx.createBufferSource();s.buffer=song.buf;s.connect(outM);s.start(t0)}else if(song.builtin)music();
  paused=false;$('pm').hidden=true;ov.hidden=true;E.hidden=true;running=true;mode='game';
  Pose.use=Pose.inp!=='mouse'&&!!Pose.cal&&!(Opt.auto&&!song.check);LOOPT=song.loop?song.loopLen*BEAT:0;chk.length=0;Pose.lb=-9;$('ck').hidden=!song.check;if(song.check){syncCk();if(ckColl===null)ckColl=matchMedia('(max-width:720px)').matches;$('ck').classList.toggle('col',ckColl);$('ck_tg').textContent=ckColl?'開く':'しまう'}
}

function judge(txt,c,k){
  jt=txt;jtc=c;jtt=performance.now();
  if(k==='M'){st.M++;st.combo=0}
  else{st[k]++;st.combo++;st.max=Math.max(st.max,st.combo);st.score+=1e6/TOT*{P:1,Gr:.7,Go:.4}[k]}
}
const NEED={t:'step',l:'step',j:'jump',d:'down'};
function rel(id,lat){
  if(!running||paused)return;const t=ctx.currentTime-t0-(lat||0),k=id==null?'p':id;
  for(const n of notes)if(n.held===k&&!n.done){n.held=null;n.done=true;if(t>=n.e-.12)judge('PERFECT','#ffd23d','P');else judge('MISS','#8a7fb0','M')}
}
function hit(x,act,id,lat){
  if(!running||paused)return;
  flash.push({x,a:1});const t=ctx.currentTime-t0-(lat||0);
  let best=null,bs=9;
  for(const n of notes){
    if(n.done||n.held!=null)continue;
    const d=n.t-t;if(d>.18)break;if(d<-.18)continue;
    if(act&&act!==NEED[n.k])continue;
    const dx=Math.abs(n.x-x);if(dx>Math.max(.06,wf(n)/2+.03))continue;
    const s=Math.abs(d)+dx;if(s<bs){bs=s;best=n}
  }
  const n=best;
  if(n){
    const d=n.t-t;
    if(n.k==='l')n.held=id==null?'p':id;else n.done=true;
    const ad=Math.abs(d);if(song.check&&(n.k==='t'||n.k==='l'))chk.push(d);
    if(ad<.05)judge('PERFECT','#ffd23d','P');else if(ad<.1)judge('GREAT','#3de0ff','Gr');else judge('GOOD','#ff9ad0','Go');
    if(Opt.tap)osc('triangle',1320,ctx.currentTime,.08,.15,0,true);
    return;
  }
}
// 入力層: 位置 x は 0(フロア左端)〜1(右端)。外部デバイスは StepRush.press(x) を呼ぶだけでよい。
const geo=()=>({LW:W*.32,cx:W/2});
const press=(x,act,id)=>hit(Math.min(1,Math.max(0,x)),act,id);
const release=id=>rel(id);
window.StepRush={press,release};
addEventListener('message',e=>{const d=e.data;if(!d)return;if(d.type==='step'&&typeof d.x==='number')press(d.x,d.act,d.id);if(d.type==='release')release(d.id)});
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='edit')return edPointer(e);if(Pose.use)return;const{LW,cx}=geo();press((e.clientX-(cx-1.5*LW))/(3*LW),e.shiftKey?'jump':(e.ctrlKey||e.altKey)?'down':undefined,e.pointerId)});

// リザルト: 最後のノーツから3秒待って、音をフェードアウトしながら画面をフェードで切り替える
function finish(){
  running=false;
  if(out){const o=out;out=null;try{o.gain.linearRampToValueAtTime(0,ctx.currentTime+.8)}catch(e){}setTimeout(()=>{try{o.disconnect()}catch(e){}},900)}
  const tot=Math.max(1,TOT),acc=(st.P+st.Gr*.7+st.Go*.4)/tot,rk=acc>=.95?'S':acc>=.85?'A':acc>=.7?'B':'C';
  const rows=[['PERFECT',st.P,'#ffd23d'],['GREAT',st.Gr,'#3de0ff'],['GOOD',st.Go,'#ff9ad0'],['MISS',st.M,'#8a7fb0']].map(([n,v,c])=>`<div class='jr'><span style='color:${c}'>${n}</span><i style='background:${c};width:${Math.round(v/tot*100)}%;min-width:${v?4:0}px'></i><b>${v}</b></div>`).join('');
  ov.className='res';ov.hidden=false;
  ov.innerHTML=`<p style='opacity:.7;letter-spacing:.2em'>RESULT</p>${st.auto?"<p style='color:#ffd23d;letter-spacing:.2em'>AUTOPLAY</p>":''}${song.jacket?`<img class='jk' src='${song.jacket}' alt='' style='width:120px'>`:''}<p>${esc(song.title)}${song.artist?'　/　'+esc(song.artist):''}</p><div class='rank' style='color:${rk==='S'?'#ffd23d':'#3de0ff'}'>${rk}</div><h1 style='font-size:44px'>${Math.round(st.score).toLocaleString()}</h1><p style='opacity:.7'>/ 1,000,000</p>${rows}<p>最大コンボ ${st.max}　／　ノーツ ${tot}</p><div class='row'><button id='go2'>もう一度踏む</button><button class='s' id='go3'>${testing?'エディタへ戻る':'メニュー'}</button></div>`;
  $('go2').onclick=start;$('go3').onclick=leave;
}
function finishOld(){
  running=false;if(out){out.disconnect();out=null}
  const tot=notes.length+notes.filter(n=>n.k==='l').length,acc=(st.P+st.Gr*.7+st.Go*.4)/tot;
  const rk=acc>=.95?'S':acc>=.85?'A':acc>=.7?'B':'C';
  ov.innerHTML=`<div class="rank" style="color:${rk==='S'?'#ffd23d':'#3de0ff'}">${rk}</div>
  <h1 style="font-size:40px;text-shadow:3px 3px 0 #ff3d8b">${Math.round(st.score).toLocaleString()}</h1>
  <p>PERFECT ${st.P}　GREAT ${st.Gr}　GOOD ${st.Go}　MISS ${st.M}<br>最大コンボ ${st.max}</p>
  <div class="row"><button id="go2">もう一度踏む</button><button class="s" id="go3">${testing?'エディタへ戻る':'メニュー'}</button></div>`;
  ov.hidden=false;document.getElementById('go2').onclick=start;document.getElementById('go3').onclick=leave;
}

/* ===== 曲データ・読み込み・書き出し ===== */
const $=id=>document.getElementById(id),E=$('ed'),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bs=()=>60/song.bpm;
function toast(s){const m=$('msg');m.textContent=s;m.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>m.style.opacity=0,3000)}
function aud(){if(!ctx)ctx=new AudioContext();ctx.resume();if(!out)mkOut()}
function pick(acc,cb){const i=$('fi');i.accept=acc;i.value='';i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click()}
const rd=(f,m)=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x[m](f)});
// ノーツ幅: wd=N なら床の1/N。横の分割と同じ数値列。旧形式の w(1/2/4) は .22×w として扱う
const W9=[1,2,4,6,8,12,16,24,32],wf=n=>n.wd?1/n.wd:(n.k==='j'||n.k==='d')?1:.22*(n.w||1);
const mk=o=>({title:'無題',artist:'',bpm:120,offset:0,builtin:false,notes:[],jacket:null,buf:null,audioName:'',spd:1,uoff:0,...o});
song=mk({title:'デモ曲',artist:'内蔵曲',bpm:128,builtin:true});songs=[song];
function save(){try{localStorage.setItem('sr_songs',JSON.stringify(songs.filter(s=>!s.builtin).map(({buf,pk,raw,rawType,conv,...s})=>s)))}catch(e){}}
try{const a=JSON.parse(localStorage.getItem('sr_songs')||'[]');if(Array.isArray(a))for(const o of a)if(o&&Array.isArray(o.notes))songs.push(mk(o))}catch(e){}
function toEditable(){if(!song.builtin)return;BEAT=60/128;const ex=songs.find(s=>s.copyOf==='builtin');if(ex){song=ex;sel=songs.indexOf(ex);return}song=mk({...song,copyOf:'builtin',title:song.title+'（編集）',builtin:false,notes:chart().map(n=>({b:n.t/BEAT,x:n.x,k:'t'}))});songs.push(song);sel=songs.length-1}
// 譜面JSON: {title,artist,bpm,offset(音源内で0拍目が来る秒),audioName,jacket(dataURL),notes:[{b:拍,x:0〜1}]}
async function loadChart(j){
  const bpm=+j.bpm,off=+j.offset||0;
  if(!(bpm>0)||!Array.isArray(j.notes))throw 0;
  const ns=j.notes.map(n=>({b:n.b!=null?+n.b:(+n.t-off)*bpm/60,x:clamp(+n.x,0,1),k:/^[tljd]$/.test(n.k)?n.k:'t',h:n.h==='R'||n.h==='L'?n.h:undefined,len:+n.len>0?+n.len:undefined,p:Array.isArray(n.p)?n.p.map(q=>({d:+q.d,x:clamp(+q.x,0,1)})).filter(q=>q.d>0&&isFinite(q.x)):undefined,w:[1,2,4].includes(+n.w)?+n.w:undefined,wd:W9.includes(+n.wd)?+n.wd:undefined})).filter(n=>isFinite(n.b)&&isFinite(n.x)).sort((a,c)=>a.b-c.b);
  song=mk({title:j.title||'無題',artist:j.artist||'',bpm,offset:off,notes:ns,jacket:j.jacket||null,audioName:j.audioName||''});songs.push(song);sel=songs.length-1;save();
  if(j.audio&&typeof j.audio.data==='string'){
    try{aud();const bin=atob(j.audio.data.split(',')[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      song.raw=u.buffer;song.rawType=j.audio.type||'';song.conv=!!j.audio.converted;song.audioName=j.audio.name||j.audioName||'';
      song.buf=await ctx.decodeAudioData(u.buffer.slice(0));song.pk=analyze(song.buf).pk}
    catch(e){toast('音源を展開できませんでした')}
  }
  toast(`読み込み完了（${ns.length}ノーツ）`+(!song.buf&&song.audioName?`　音源「${song.audioName}」も読み込んでください`:''));
}
const toJSON=()=>JSON.stringify({format:'steprush-2',title:song.title,artist:song.artist,bpm:song.bpm,offset:song.offset,audioName:song.audioName,jacket:song.jacket,notes:song.notes.map(n=>({b:+n.b.toFixed(4),x:+n.x.toFixed(4),k:n.k||'t',h:n.h,len:n.len,p:n.p&&n.p.map(q=>({d:+q.d.toFixed(4),x:+q.x.toFixed(4)})),w:n.w,wd:n.wd}))});
// 音源解析: 10msごとの波形(pk)、オンセット強度→BPM(自己相関)→拍の位相→小節頭(4拍のうち最も強い拍)
function analyze(buf){
  const sr=buf.sampleRate,hop=Math.round(sr/100),n=Math.floor(buf.length/hop);
  const a=buf.getChannelData(0),b=buf.numberOfChannels>1?buf.getChannelData(1):a;
  const pk=new Float32Array(n),e=new Float32Array(n);

    if(au)o.audio=au;
    await d.save({filename:(song.title||'chart').replace(/[\\/:*?"<>|]/g,'_')+'.srpack.json',data:new Blob([JSON.stringify(o)],{type:'application/json'})});
    toast(o.audio?(o.audio.converted?'音源をMP3に変換して書き出しました（'+(o.audio.data.length*.75/1e6).toFixed(1)+'MB）':'音源・ジャケット込みで書き出しました'):'書き出しました（音源は含まれていません）');
  }catch(e){if(!e||e.code!=='declined')toast('書き出せませんでした（'+(e&&(e.code||e.message)||e)+'）')}
}
$('e_ex').onclick=exportSong;
const exOld=async()=>{
  const d=window.claude?await claude.use('downloads'):null;
  if(!d)return toast('この環境では書き出せません');
  try{await d.save({filename:(song.title||'chart').replace(/[\\/:*?"<>|]/g,'_')+'.json',data:new Blob([toJSON()],{type:'application/json'})})}catch(e){if(!e||e.code!=='declined')toast('書き出せませんでした')}
};
$('e_nw').onclick=()=>{edStop();edOpen(true)};
$('e_sv').onclick=edSave;
$('e_cl').onclick=()=>{edStop();song=songs[sel];mainMenu()};

function draw(){
  {const v=running&&!paused&&mode==='game';if(draw.pbv!==v){draw.pbv=v;$('pb').hidden=!v}}
  if(mode==='edit'){drawEdit();return requestAnimationFrame(draw)}
  let t=running?ctx.currentTime-t0:-LEAD;
  if(running){
    if(song.loop&&t>LOOPT){t0+=LOOPT;t-=LOOPT;for(const n of notes){n.done=false;n.held=null;n.dev=0}if(Auto.run&&++Auto.loops>=3)finishAuto()}
    if(Opt.auto&&!song.check)autoPlay(t);
    for(const n of notes){
      if(n.done)continue;
      if(n.held!=null){if(t>=n.e){n.done=true;n.held=null;judge('PERFECT','#ffd23d','P')}}
      else if(n.t<t-.18){n.done=true;judge('MISS','#8a7fb0','M');if(n.k==='l')judge('MISS','#8a7fb0','M')}
    }
    if(!song.loop&&t>END+3)finish();
    if(!paused){poseTick(t);if(song.check)metro(t)}
    if(song.check)drawCk();
  }
  const{LW,cx}=geo(),VP=H*.08,J=H*.8;
  const P=(e,d)=>[cx+e*LW/d,VP+(J-VP)/d];
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#14062b');bg.addColorStop(.5,'#2b0d5c');bg.addColorStop(1,'#14062b');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  // floor (レーンなし)
  {
    const a=P(-1.5,6.5),b=P(1.5,6.5),c=P(1.5,.85),d=P(-1.5,.85);
    g.beginPath();g.moveTo(...a);g.lineTo(...b);g.lineTo(...c);g.lineTo(...d);g.closePath();
    const fg=g.createLinearGradient(P(-1.5,1)[0],0,P(1.5,1)[0],0);
    for(let k=0;k<=4;k++)fg.addColorStop(k/4,hue(k/4));
    g.fillStyle=fg;g.globalAlpha=.14;g.fill();g.globalAlpha=1;
    g.strokeStyle='rgba(246,239,255,.35)';g.lineWidth=2;g.stroke();
  }
  for(let k=flash.length-1;k>=0;k--){flash[k].a-=.06;if(flash[k].a<=0)flash.splice(k,1)}
  // beat lines
  const b0=Math.ceil((t-OFF)/BEAT);
  for(let b=b0;OFF+b*BEAT-t<APP;b++){
    const z=(OFF+b*BEAT-t)/APP,d=1+5*z,l=P(-1.5,d),r=P(1.5,d);
    g.strokeStyle=b%4===0?'rgba(255,255,255,.45)':'rgba(255,255,255,.14)';g.lineWidth=b%4===0?3:1.5;
    g.beginPath();g.moveTo(...l);g.lineTo(...r);g.stroke();
  }
  // notes
  for(let i=notes.length-1;i>=0;i--){
    const n=notes[i];if(n.done)continue;
    const zh=Math.max(0,(n.t-t)/APP);if(zh>1)continue;
    const hx=n.k==='l'?xAt(n,Math.max(n.t,t)):n.x,dh=1+5*zh,[x,y]=P((hx-.5)*3,dh),w=LW*3*wf(n)/dh,h=LW*.2/dh;
    if(n.k==='l'){
      const t1=Math.max(t,n.t),t2=Math.min(n.e,t+APP),Lp=[],Rp=[];
      for(let s=0;s<=16;s++){const tt=t1+(t2-t1)*s/16,d2=1+5*Math.min(1,Math.max(0,(tt-t)/APP)),[px,py]=P((xAt(n,tt)-.5)*3,d2),hw=LW*3*wf(n)/d2*.4;Lp.push([px-hw,py]);Rp.push([px+hw,py])}
      g.fillStyle=ncol(n);g.globalAlpha=n.held!=null?.85:.5;
      g.beginPath();Lp.forEach((q,i)=>i?g.lineTo(...q):g.moveTo(...q));Rp.reverse().forEach(q=>g.lineTo(...q));g.closePath();g.fill();g.globalAlpha=1;
    }
    drawHead(x,y,w,h,n);
  }
  // 判定ライン + タップ位置のリップル
  {
    const l=P(-1.5,1),r=P(1.5,1);
    g.strokeStyle='#f6efff';g.lineWidth=5;g.beginPath();g.moveTo(...l);g.lineTo(...r);g.stroke();
    for(const f of flash){
      const [x,y]=P((f.x-.5)*3,1),rad=LW*.12+(1-f.a)*LW*.25;
      g.globalAlpha=f.a;g.strokeStyle=hue(f.x);g.lineWidth=5;
      g.beginPath();g.arc(x,y,rad,0,7);g.stroke();g.globalAlpha=1;
    }
  }
  // 足の接地(=押している)状態: 床についている間は塗りつぶし、離れている間は点線の枠
  if(Pose.use)for(const k of['L','R']){
    const f=Pose.feet[k],[x,y]=P((f.x-.5)*3,1),w=LW*.42,h=LW*.16;
    g.beginPath();g.roundRect(x-w/2,y-h/2,w,h,h*.3);g.fillStyle=k==='L'?'#2f7bff':'#ff6a1a';
    if(f.g){g.globalAlpha=.85;g.fill();g.globalAlpha=1;g.strokeStyle='#fff';g.lineWidth=3;g.stroke()}
    else{g.strokeStyle=g.fillStyle;g.lineWidth=3;g.setLineDash([6,5]);g.stroke();g.setLineDash([])}
  }
  // HUD
  g.fillStyle='#f6efff';g.font='28px "Dela Gothic One",sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText(String(Math.round(st.score||0)).padStart(7,'0'),cx,H*.04+16);
  const age=(performance.now()-jtt)/1000;
  if(age<.7){
    g.globalAlpha=1-age/.7;g.fillStyle=jtc;g.font='34px "Dela Gothic One",sans-serif';g.fillText(jt,cx,H*.5);
    if(st.combo>1){g.fillStyle='#f6efff';g.font='56px "Dela Gothic One",sans-serif';g.fillText(st.combo,cx,H*.5+54)}
    g.globalAlpha=1;
  }
  requestAnimationFrame(draw);
}
 mainMenu();draw();
</script>
